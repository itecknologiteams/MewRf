# nginx front end for api.maliroperations.com -> gunicorn on 127.0.0.1:8000
#
#   sudo cp deploy/nginx-api.maliroperations.com.conf \
#           /etc/nginx/sites-available/api.maliroperations.com
#   sudo ln -sf /etc/nginx/sites-available/api.maliroperations.com \
#               /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # its catch-all :80 would win
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Why this exists at all ───────────────────────────────────────────────────
# Port 8000 stays open on the LAN because the booths reach master directly at
# 192.168.78.200:8000 — do NOT firewall it. This adds a second, public path on :80 via a
# hostname, which is what a TLS certificate can be issued for. Nothing else changes.
#
# ── Moving to 443 later ──────────────────────────────────────────────────────
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.maliroperations.com
#
# certbot edits THIS file in place: it adds the 443 server block, the certificate paths, and
# a 301 from :80. The acme-challenge location below is what it uses to prove domain
# ownership, so leave it even after switching.
#
# Then on master, in mtag_backend/.env:
#   DJANGO_SETTINGS_MODULE=config.settings.production
# which sets SESSION_COOKIE_SECURE=True, HSTS and the SSL redirect. The cookie code already
# keys off SESSION_COOKIE_SECURE (see _set_auth_cookies), so session cookies become Secure
# with no code change — and the app moves to `--flavor prod`, which refuses cleartext.

upstream mtag_backend {
    # 127.0.0.1, not 0.0.0.0: nginx and gunicorn are on the same host, so the proxy hop
    # never needs to leave the loopback.
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.maliroperations.com;

    # Let's Encrypt HTTP-01 challenge. Kept above the proxy so certbot can write files here
    # without Django ever seeing the request — and kept after the TLS switch, because
    # renewals use the same path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Toll receipts and CSV uploads are small, but an operator bulk-uploading tag inventory
    # is not. The default 1m would reject it with a bare 413.
    client_max_body_size 12m;

    # A cash top-up at a booth writes to the DB and prints a receipt; 60s is a long time for
    # that but far better than a 504 leaving the operator unsure whether money moved.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://mtag_backend;
        proxy_http_version 1.1;

        # Django checks the HOST header against ALLOWED_HOSTS. Forwarding the original is
        # what makes api.maliroperations.com the value it sees — pass nginx's own and every
        # request 400s.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Read by SECURE_PROXY_SSL_HEADER once TLS terminates here. Without it Django thinks
        # every request is plain HTTP and, under production settings, redirect-loops trying
        # to "upgrade" a request that already arrived over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_buffering off;
    }
}
