# Operator portal (rfid-frontend) on master — Apache, port 8081.
#
#   sudo cp deploy/apache-rfid-portal.conf /etc/apache2/sites-available/rfid-portal.conf
#   sudo a2enmod proxy proxy_http rewrite headers
#   grep -q '^Listen 8081' /etc/apache2/ports.conf || echo 'Listen 8081' | sudo tee -a /etc/apache2/ports.conf
#   sudo a2ensite rfid-portal
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Why 8081 and not 80: :80 is Apache's default site and :8080 already serves the
# receipts/snapshots media tree. Both are in use on master.

<VirtualHost *:8081>
    DocumentRoot /var/www/rfid-portal

    # The portal calls the API at the RELATIVE path /api/v1, so the browser only ever
    # makes a same-origin request. That is not cosmetic: Django issues session cookies
    # SameSite=Lax, and a Lax cookie is never sent on a cross-site fetch — point the
    # browser straight at :8000 and login returns 200 while every call after it is
    # anonymous, which shows up as a dashboard that spins forever.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Django reads this under production settings; without it, it believes every
    # request arrived over plain HTTP.
    RequestHeader set X-Forwarded-Proto "http"

    # Bulk tag-inventory CSV uploads exceed the 1m default and would fail with a bare 413.
    LimitRequestBody 12582912

    <Directory /var/www/rfid-portal>
        Require all granted
        Options -Indexes

        # Hashed asset filenames change whenever their content does, so they are safe
        # to cache forever. index.html is NOT hashed — cache it and browsers keep asking
        # for the previous build's asset names after an upgrade, which 404 into a blank
        # page until a hard refresh.
        <FilesMatch "\.(js|css|png|jpg|woff2)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>

        # SPA fallback. The app uses BrowserRouter, so /plazas and /inventory are
        # client-side routes with no file behind them; without this, every deep link
        # and every browser refresh 404s.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rfid-portal-error.log
    CustomLog ${APACHE_LOG_DIR}/rfid-portal-access.log combined
</VirtualHost>
