name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated code is NOT committed, so it has to be built before analysis — drift's
      # database and freezed's data classes are both `part` files the app cannot compile
      # without.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localisations
        run: flutter gen-l10n

      # A key present in app_en.arb and missing from app_ur.arb would otherwise ship an
      # English string inside an Urdu build, silently. gen-l10n writes the gap to this file;
      # a non-empty one fails the build.
      - name: Fail on untranslated strings
        run: |
          if [ -s l10n_untranslated.json ] && [ "$(tr -d '[:space:]' < l10n_untranslated.json)" != "{}" ]; then
            echo "::error::Untranslated messages found:"
            cat l10n_untranslated.json
            exit 1
          fi

      # --fatal-infos: the analysis_options.yaml turns off the rules that genuinely conflict
      # with Riverpod 3 and documents why, so anything left is a real finding.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      # Includes the clay goldens. A visual regression fails here rather than reaching a
      # screen, which is the whole reason they exist.
      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      # The lan flavour, in release, because that is the configuration operators actually
      # deploy to the toll LAN — and the one where a debug-only cleartext manifest would
      # have silently broken the session cookie.
      - name: Build APK (lan, release)
        run: |
          flutter build apk --release --flavor lan \
            --dart-define=MTAG_FLAVOR=lan \
            --dart-define=MTAG_API_BASE=http://192.168.78.200:8000

      # prod, to prove the pinned/HTTPS configuration compiles and that a prod build with
      # pins supplied does not trip the launch-time guard.
      - name: Build APK (prod, release)
        run: |
          flutter build apk --release --flavor prod --split-per-abi \
            --dart-define=MTAG_FLAVOR=prod \
            --dart-define=MTAG_API_BASE=https://api.example.invalid \
            --dart-define=MTAG_CERT_PINS=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      # --no-codesign: CI has no provisioning profile. This verifies the iOS build compiles
      # and links, which is what catches a plugin that has no iOS implementation.
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=MTAG_FLAVOR=prod \
            --dart-define=MTAG_API_BASE=https://api.example.invalid \
            --dart-define=MTAG_CERT_PINS=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
