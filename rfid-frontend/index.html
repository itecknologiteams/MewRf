<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ME · Smart Expressway Toll System</title>
    <meta name="description" content="Smart Expressway toll management — M-Tag registration, plazas, trips and settlement." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Matches the --canvas token per theme so the browser chrome doesn't flash. -->
    <meta name="theme-color" content="#F0F1F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1121" media="(prefers-color-scheme: dark)" />

    <!-- index.css asks for Inter; without this it silently fell back to system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <script>
      // Apply the stored theme before first paint, otherwise a dark-mode user
      // gets a white flash while React boots.
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
